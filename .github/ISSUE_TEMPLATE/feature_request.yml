name: Feature request
description: Suggest a focused improvement.
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 请描述用户遇到的实际问题，而不是只描述实现方式。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: checkboxes
    id: boundaries
    attributes:
      label: 约束确认
      options:
        - label: 该建议不要求自动购买、出售、刷新、部署或切换策略。
          required: true
        - label: 该建议不要求读取账号、WebSocket 或隐藏游戏状态。
          required: true
